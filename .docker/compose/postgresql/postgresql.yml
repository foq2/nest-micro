services:
  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    restart: unless-stopped
    logging:
      driver: json-file
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DEFAULT_PG_USER} -d ${DEFAULT_PG_DATABASE}" ]
      interval: 24h
      timeout: 5s
      retries: 3
      start_period: 10s
